<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176B5B">
  <meta name="description" content="CAA 2026 di Riccardo Manzo: strumento operativo accessibile con comunicatore CAA, agenda visiva e funzionamento offline.">
  <meta name="application-name" content="CAA 2026">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CAA 2026">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>CAA 2026</title>

  <style>
    :root {
      --primary: #176B5B;
      --primary-dark: #0F4F43;
      --bg: #F4F7F6;
      --surface: #FFFFFF;
      --text: #17211F;
      --muted: #5A6864;
      --focus: #FFBF47;
      --ok: #167A3B;
      --danger: #B42318;
      --offline: #B45309;
      --radius: 18px;
      --shadow: 0 4px 14px rgba(0,0,0,.10);
    }

    * { box-sizing: border-box; }
    html { font-size: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    button { font: inherit; touch-action: manipulation; }
    button:focus-visible, a:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      left: 12px;
      top: -80px;
      z-index: 9999;
      padding: 12px 16px;
      color: #fff;
      background: #000;
      border-radius: 8px;
    }
    .skip-link:focus { top: 12px; }

    header {
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      color: #fff;
      background: var(--primary);
    }
    .header-inner {
      width: min(100% - 8px, 1100px);
      margin: 0 auto;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.25rem); }
    header p { margin: 4px 0 0; opacity: .94; }

    main {
      width: min(100% - 24px, 1100px);
      margin: 0 auto;
      padding: 8px 0 40px;
    }


    .panel {
      background: var(--surface);
      border-radius: 22px;
      padding: clamp(10px, 2.6vw, 16px);
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 4vw, 1.85rem);
    }
    .lead { margin: 0 0 18px; color: var(--muted); }

    .caa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
      gap: 14px;
    }

    .caa-card {
      min-height: 158px;
      padding: 16px 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 3px solid transparent;
      border-radius: var(--radius);
      color: var(--text);
      background: #fff;
      box-shadow: 0 3px 11px rgba(0,0,0,.09);
      cursor: pointer;
    }
    .caa-card:hover { border-color: var(--primary); }
    .caa-card:active { transform: scale(.985); }
    .caa-card.yes { border-color: var(--ok); }
    .caa-card.no { border-color: var(--danger); }
    .caa-card:not(.yes):not(.no) { border-color: #111; }
    .caa-card.is-active {
      box-shadow: 0 0 0 2px rgba(23,107,91,.15), 0 3px 11px rgba(0,0,0,.09);
    }
    .caa-card.yes.is-active { border-color: var(--ok); }
    .caa-card.no.is-active { border-color: var(--danger); }
    .caa-card:not(.yes):not(.no).is-active,
    .caa-card:not(.yes):not(.no):hover { border-color: #111; }
    .caa-card--long {
      min-height: 178px;
    }
    .caa-card--featured {
      min-height: 170px;
    }

    .symbol { font-size: 2.35rem; line-height: 1; }
    .symbol--img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      display: block;
      border-radius: 12px;
      background: #fff;
    }
    .label {
      line-height: 1.2;
      font-size: clamp(1rem, 3vw, 1.18rem);
      font-weight: 800;
      text-align: center;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .caa-card--long .label {
      font-size: clamp(0.95rem, 2.7vw, 1.08rem);
    }
    .caa-card--featured .symbol--img {
      width: 96px;
      height: 96px;
    }

    .spoken {
      min-height: 72px;
      margin-top: 18px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(1.15rem, 4vw, 1.65rem);
      font-weight: 800;
      border: 2px solid var(--primary);
      border-radius: 14px;
      background: #fff;
    }

    .footer-note {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-left: 5px solid var(--primary);
      border-radius: 8px;
      background: #E8F3F0;
      color: #27322F;
    }

    .error-box {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 2px solid var(--danger);
      border-radius: 12px;
      background: #FFF1F0;
    }
    .error-box.visible { display: block; }



    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .app-nav {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    .app-nav-button {
      min-height: 46px;
      padding: 8px 13px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 12px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: .9rem;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app-nav-button.is-current {
      background: #fff;
      color: var(--primary-dark);
    }

    .app-nav-button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }


    .app-install-button {
      border-color: #fff;
      background: #fff;
      color: var(--primary-dark);
    }

    .app-install-button[hidden] {
      display: none !important;
    }

    @media (max-width: 520px) {
      .app-install-button {
        flex: 0 0 100%;
      }
    }

    .app-view[hidden] {
      display: none !important;
    }

    @media (max-width: 520px) {
      .header-inner {
        align-items: stretch;
      }

      .header-inner h1 {
        width: 100%;
      }

      .app-nav {
        width: 100%;
        margin-left: 0;
      }

      .app-nav-button {
        flex: 1 1 0;
        min-width: 0;
        font-size: .84rem;
        padding-inline: 8px;
      }
    }

    /* =========================
       AGENDA VISIVA
       ========================= */
    .agenda-panel {
      margin-top: 22px;
      padding: clamp(12px, 3vw, 18px);
      background: var(--surface);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .agenda-panel h2 {
      margin: 0 0 18px;
      text-align: center;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      letter-spacing: .02em;
    }

    .agenda-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .agenda-column {
      min-width: 0;
      padding: 10px;
      border: 3px solid #111;
      border-radius: 16px;
      background: #fff;
    }

    .agenda-column h3 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      line-height: 1.15;
    }

    .agenda-list {
      min-height: 240px;
    }

    .agenda-card {
      width: 100%;
      min-height: 84px;
      margin: 0 0 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 3px solid #111;
      border-radius: 14px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: clamp(.92rem, 3vw, 1.05rem);
      font-weight: 800;
      line-height: 1.18;
      text-align: center;
      overflow-wrap: anywhere;
      text-wrap: balance;
      cursor: pointer;
      touch-action: manipulation;
    }

    .agenda-card:last-child {
      margin-bottom: 0;
    }

    .agenda-card:hover {
      background: #f5f7f6;
    }

    .agenda-card:active {
      transform: scale(.985);
    }

    .agenda-card:focus-visible,
    .agenda-reset:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    .agenda-card--done {
      opacity: .72;
    }

    .agenda-card-state {
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .agenda-reset {
      width: 100%;
      min-height: 54px;
      margin-top: 16px;
      padding: 10px 14px;
      border: 3px solid #111;
      border-radius: 14px;
      background: #fff;
      color: #111;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    .agenda-reset:hover {
      background: #f5f7f6;
    }

    @media (max-width: 420px) {
      .agenda-panel {
        padding: 10px;
      }

      .agenda-grid {
        gap: 8px;
      }

      .agenda-column {
        padding: 7px;
      }

      .agenda-list {
        min-height: 210px;
      }

      .agenda-card {
        min-height: 78px;
        padding: 8px 5px;
        font-size: .88rem;
      }
    }



    .agenda-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .agenda-action {
      min-height: 52px;
      padding: 9px 12px;
      border: 3px solid #111;
      border-radius: 14px;
      background: #fff;
      color: #111;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    .agenda-action--primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .agenda-action:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .agenda-action:focus-visible,
    .activity-picker-card:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    .activity-picker {
      padding: 14px;
      border: 3px solid var(--primary);
      border-radius: 18px;
      background: #f7fbfa;
    }

    .activity-picker[hidden] {
      display: none !important;
    }

    .activity-picker h3 {
      margin: 0 0 6px;
      text-align: center;
      font-size: clamp(1.15rem, 4vw, 1.4rem);
    }

    .activity-picker-instruction {
      margin: 0 auto 14px;
      max-width: 60ch;
      color: var(--muted);
      text-align: center;
      font-size: .92rem;
    }

    .activity-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(138px, 100%), 1fr));
      gap: 10px;
    }

    .activity-picker-card {
      position: relative;
      min-height: 150px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 3px solid #111;
      border-radius: 14px;
      background: #fff;
      color: #111;
      font: inherit;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .activity-picker-card[aria-pressed="true"] {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 2px var(--primary);
      background: #eef8f5;
    }

    .activity-picker-card img {
      width: 82px;
      height: 76px;
      object-fit: contain;
      display: block;
      border-radius: 8px;
      background: #fff;
    }

    .activity-picker-order {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: .9rem;
      font-weight: 900;
    }

    .activity-picker-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .agenda-empty {
      padding: 18px 8px;
      color: var(--muted);
      text-align: center;
      font-size: .92rem;
      line-height: 1.35;
    }

    @media (max-width: 420px) {
      .activity-picker {
        padding: 10px;
      }

      .activity-picker-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .activity-picker-card {
        min-height: 140px;
        padding: 8px 5px;
        font-size: .88rem;
      }

      .activity-picker-card img {
        width: 72px;
        height: 66px;
      }

      .agenda-toolbar,
      .activity-picker-actions {
        gap: 8px;
      }
    }

    .agenda-instruction {
      margin: -8px 0 16px;
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
    }

    .agenda-column--done {
      background: #f4faf6;
    }

    .agenda-card {
      min-height: 136px;
      padding: 10px 8px;
    }

    .agenda-card-visual {
      width: 88px;
      height: 74px;
      object-fit: contain;
      display: block;
      flex: 0 0 auto;
      border-radius: 8px;
      background: #fff;
    }

    .agenda-card-label {
      display: block;
    }

    .agenda-card--done .agenda-card-visual {
      opacity: .78;
    }

    @media (max-width: 420px) {
      .agenda-card {
        min-height: 126px;
      }

      .agenda-card-visual {
        width: 72px;
        height: 62px;
      }
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 420px) {
      main { width: min(100% - 16px, 1100px); }
      .caa-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .caa-card { min-height: 144px; padding: 12px 8px 10px; }
      .caa-card--long { min-height: 162px; }
      .caa-card--featured { min-height: 160px; }
      .caa-card--featured .symbol--img { width: 92px; height: 92px; }
      .caa-card--long .label { font-size: 0.92rem; }
    }
    @media (min-width: 800px) {
      .caa-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .caa-card:active { transform: none; }
    }
    @media (prefers-contrast: more) {
      :root { --text: #000; --bg: #fff; }
      .caa-card { border-color: #000; box-shadow: none; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Vai al contenuto</a>

  <header>
    <div class="header-inner">
      <h1 class="app-title"><span class="app-title-main">CAA 2026</span><span class="app-title-sub">DI RICCARDO MANZO</span></h1>

      <nav class="app-nav" aria-label="Sezioni CAA 2026">
        <button
          id="showCommunicator"
          class="app-nav-button is-current"
          type="button"
          aria-controls="communicatorView"
          aria-pressed="true">
          COMUNICATORE
        </button>

        <button
          id="showAgenda"
          class="app-nav-button"
          type="button"
          aria-controls="agendaView"
          aria-pressed="false">
          AGENDA VISIVA
        </button>

        <button
          id="installApp"
          class="app-nav-button app-install-button"
          type="button"
          hidden>
          INSTALLA
        </button>
      </nav>
    </div>
  </header>

  <div
    id="pwaAnnouncement"
    class="sr-only"
    aria-live="polite"
    aria-atomic="true">
  </div>

  <main id="main" tabindex="-1">
    <div id="errorBox" class="error-box" role="alert"></div>

    <section
      id="communicatorView"
      class="app-view"
      aria-label="Comunicatore CAA">
      <section class="panel" aria-label="Comunicatore CAA">
        <div id="caaGrid" class="caa-grid" aria-label="Comunicatore CAA"></div>

        <div
          id="spoken"
          class="spoken sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true">
          Seleziona una comunicazione
        </div>
      </section>
    </section>

    <section
      id="agendaView"
      class="app-view"
      aria-labelledby="agendaTitle"
      hidden>
      <section class="agenda-panel">
        <h2 id="agendaTitle" tabindex="-1">AGENDA VISIVA</h2>

        <div class="agenda-toolbar">
          <button
            id="chooseActivities"
            class="agenda-action agenda-action--primary"
            type="button"
            aria-controls="activityPicker"
            aria-expanded="false">
            SCEGLI ATTIVITÀ
          </button>

          <button id="resetAgenda" class="agenda-action" type="button">
            RESET AGENDA
          </button>
        </div>

        <section
          id="activityPicker"
          class="activity-picker"
          aria-labelledby="activityPickerTitle"
          hidden>

          <h3 id="activityPickerTitle">SCEGLI LE ATTIVITÀ</h3>

          <p class="activity-picker-instruction">
            Tocca i pittogrammi nell’ordine in cui vuoi svolgere le attività.
            Il numero indica la posizione nell’agenda.
          </p>

          <div
            id="activityPickerGrid"
            class="activity-picker-grid"
            aria-label="Attività disponibili">
          </div>

          <div class="activity-picker-actions">
            <button
              id="cancelActivitySelection"
              class="agenda-action"
              type="button">
              ANNULLA
            </button>

            <button
              id="confirmActivitySelection"
              class="agenda-action agenda-action--primary"
              type="button">
              CONFERMA AGENDA
            </button>
          </div>
        </section>

        <div id="agendaWorkspace">
          <p class="agenda-instruction">
            Tocca una tessera per spostarla tra ATTIVITÀ e FINITO.
          </p>

          <div class="agenda-grid">
            <section class="agenda-column" aria-labelledby="agendaTodoTitle">
              <h3 id="agendaTodoTitle">ATTIVITÀ</h3>
              <div id="agendaTodo" class="agenda-list"></div>
            </section>

            <section class="agenda-column agenda-column--done" aria-labelledby="agendaDoneTitle">
              <h3 id="agendaDoneTitle">FINITO</h3>
              <div id="agendaDone" class="agenda-list"></div>
            </section>
          </div>
        </div>

        <div
          id="agendaAnnouncement"
          class="sr-only"
          aria-live="polite"
          aria-atomic="true">
        </div>
      </section>
    </section>
  </main>

<script>

function openDB() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("IndexedDB non disponibile"));
      return;
    }

    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_CAA)) {
        const store = db.createObjectStore(STORE_CAA, { keyPath: "key" });
        store.createIndex("ordine", "ordine", { unique:false });
      }

      if (!db.objectStoreNames.contains(STORE_AGENDA)) {
        const agendaStore = db.createObjectStore(STORE_AGENDA, { keyPath: "id" });
        agendaStore.createIndex("ordine", "ordine", { unique:false });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}


function cloneDefaults() {
  return DEFAULT_CAA.map(item => ({ ...item }));
}

function migrateItems(existingItems) {
  const existingMap = new Map((existingItems || []).map(item => [item.key, item]));

  const migrated = DEFAULT_CAA.map(defaultItem => {
    const existing = existingMap.get(defaultItem.key);
    if (!existing) return { ...defaultItem };

    const merged = { ...defaultItem, ...existing };

    // Critical v1.4 migration:
    // previous versions stored relative image paths that break under Android content://.
    // Always replace those system pictogram paths with the embedded data URI.
    if (defaultItem.img) {
      merged.img = defaultItem.img;
    }

    // Force-update system content when the built-in default changes.
    if (["si", "no", "ancora", "bagno"].includes(defaultItem.key)) {
      merged.testo = defaultItem.testo;
      merged.voce = defaultItem.voce;
      merged.img = defaultItem.img;
      delete merged.simbolo;
    }

    // Preserve the requested order of the system CAA set.
    merged.ordine = defaultItem.ordine;

    return merged;
  });

  // Preserve any future/user-added cards that are not part of the default set.
  const knownKeys = new Set(DEFAULT_CAA.map(item => item.key));
  for (const item of existingItems || []) {
    if (!knownKeys.has(item.key)) migrated.push(item);
  }

  return migrated;
}

async function initializeIndexedDB() {
  const db = await openDB();

  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CAA, "readwrite");
    const store = tx.objectStore(STORE_CAA);
    const req = store.getAll();

    req.onsuccess = () => {
      const migrated = migrateItems(req.result || []);
      store.clear();
      migrated.forEach(item => store.put(item));
    };

    req.onerror = () => reject(req.error);

    tx.oncomplete = () => {
      db.close();
      storageMode = "indexeddb";
      resolve();
    };

    tx.onerror = () => {
      const err = tx.error;
      db.close();
      reject(err);
    };
  });
}

function initializeLocalStorage() {
  const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
  let existing = [];

  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) existing = parsed;
    } catch {}
  }

  const migrated = migrateItems(existing);
  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(migrated));
  storageMode = "localstorage";
}

async function initializeCAA() {
  try {
    await initializeIndexedDB();
    return;
  } catch (err) {
    console.warn("IndexedDB non disponibile; provo localStorage.", err);
  }

  try {
    initializeLocalStorage();
    return;
  } catch (err) {
    console.warn("localStorage non disponibile; uso memoria temporanea.", err);
  }

  memoryCAA = cloneDefaults();
  storageMode = "memory";
}

async function loadCAA() {
  let items = [];

  if (storageMode === "indexeddb") {
    const db = await openDB();
    items = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_CAA, "readonly");
      const store = tx.objectStore(STORE_CAA);
      const req = store.getAll();

      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => db.close();
    });
  } else if (storageMode === "localstorage") {
    try {
      items = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || "[]");
    } catch {
      items = [];
    }
  } else {
    items = memoryCAA.length ? memoryCAA : cloneDefaults();
  }

  return migrateItems(items)
    .filter(item => item.attiva !== false)
    .sort((a,b) => (a.ordine ?? 999) - (b.ordine ?? 999));
}

async function saveCAACard(item) {
  if (storageMode === "indexeddb") {
    const db = await openDB();

    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_CAA, "readwrite");
      tx.objectStore(STORE_CAA).put(item);

      tx.oncomplete = () => {
        db.close();
        resolve();
      };
      tx.onerror = () => {
        const err = tx.error;
        db.close();
        reject(err);
      };
    });
  }

  if (storageMode === "localstorage") {
    const items = await loadCAA();
    const idx = items.findIndex(x => x.key === item.key);
    if (idx >= 0) items[idx] = item;
    else items.push(item);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(items));
    return;
  }

  const items = memoryCAA.length ? memoryCAA : cloneDefaults();
  const idx = items.findIndex(x => x.key === item.key);
  if (idx >= 0) items[idx] = item;
  else items.push(item);
  memoryCAA = items;
}


function loadItalianVoice() {
  if (!("speechSynthesis" in window)) return;

  const voices = window.speechSynthesis.getVoices();
  italianVoice =
    voices.find(v => v.lang?.toLowerCase() === "it-it") ||
    voices.find(v => v.lang?.toLowerCase().startsWith("it")) ||
    null;
}

function prepareSpeechText(text) {
  const raw = String(text || "").trim();
  if (!raw) return "";

  // The labels are intentionally displayed in uppercase, but some Android
  // TTS engines interpret short uppercase words (e.g. "LA") as acronyms
  // and spell the individual letters. Convert only the spoken copy to
  // normal Italian sentence casing so it is read as a continuous phrase.
  const lower = raw.toLocaleLowerCase("it-IT");
  const natural = lower.charAt(0).toLocaleUpperCase("it-IT") + lower.slice(1);

  // A final punctuation mark helps Android TTS keep natural phrasing.
  return /[.!?…]$/.test(natural) ? natural : natural + ".";
}

function speak(text) {
  const speechText = prepareSpeechText(text);
  spoken.textContent = text;

  if (!speechText) return;

  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
    spoken.textContent = `${text} — sintesi vocale non disponibile`;
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(speechText);
  utterance.lang = italianVoice?.lang || "it-IT";
  utterance.rate = 0.92;
  utterance.pitch = 1;
  utterance.volume = 1;

  if (italianVoice) utterance.voice = italianVoice;

  utterance.onerror = () => {
    spoken.textContent = `${text} — audio non disponibile`;
  };

  // A very short defer after cancel() avoids occasional clipped starts
  // in Android speech engines when cards are tapped in quick succession.
  window.setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 40);
}

function createCAACard(item) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = `caa-card${item.classe ? " " + item.classe : ""}`;
  button.dataset.key = item.key;
  button.setAttribute("aria-label", `Pronuncia: ${prepareSpeechText(item.voce).replace(/[.!?…]$/, "")}`);

  const isFeatured = ["casa", "pausa"].includes(item.key);
  const isLong = (item.testo || "").length >= 22;

  if (isFeatured) button.classList.add("caa-card--featured");
  if (isLong) button.classList.add("caa-card--long");

  let visual;

  if (item.img) {
    const img = document.createElement("img");
    img.className = "symbol--img";
    img.src = item.img;
    img.alt = "";
    img.setAttribute("aria-hidden", "true");
    img.decoding = "async";
    visual = img;
  } else {
    const symbol = document.createElement("span");
    symbol.className = "symbol";
    symbol.setAttribute("aria-hidden", "true");
    symbol.textContent = item.simbolo || "●";
    visual = symbol;
  }

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = item.testo;

  button.append(visual, label);

  button.addEventListener("click", () => {
    document.querySelectorAll(".caa-card.is-active")
      .forEach(el => el.classList.remove("is-active"));
    button.classList.add("is-active");
    speak(item.voce);
  });

  return button;
}

async function renderCAA() {
  const items = await loadCAA();
  caaGrid.replaceChildren();

  items.forEach(item => caaGrid.appendChild(createCAACard(item)));

  if (!items.length) {
    spoken.textContent = "Nessuna comunicazione disponibile";
  }
}




function showAppView(viewName, moveFocus = true) {
  const communicatorView = document.getElementById("communicatorView");
  const agendaView = document.getElementById("agendaView");
  const communicatorButton = document.getElementById("showCommunicator");
  const agendaButton = document.getElementById("showAgenda");

  const showAgenda = viewName === "agenda";

  communicatorView.hidden = showAgenda;
  agendaView.hidden = !showAgenda;

  communicatorButton.classList.toggle("is-current", !showAgenda);
  agendaButton.classList.toggle("is-current", showAgenda);

  communicatorButton.setAttribute("aria-pressed", showAgenda ? "false" : "true");
  agendaButton.setAttribute("aria-pressed", showAgenda ? "true" : "false");

  document.title = showAgenda
    ? "ABA PRATICO — Agenda Visiva"
    : "ABA PRATICO — Comunicatore CAA";

  if (moveFocus) {
    requestAnimationFrame(() => {
      if (showAgenda) {
        document.getElementById("agendaTitle")?.focus?.();
        agendaView.scrollIntoView({ block: "start" });
      } else {
        communicatorView.scrollIntoView({ block: "start" });
      }
    });
  }
}

function updateViewUrl(viewName) {
  try {
    const url = new URL(location.href);

    if (viewName === "agenda") {
      url.searchParams.set("view", "agenda");
    } else {
      url.searchParams.delete("view");
    }

    history.replaceState(null, "", url);
  } catch {}
}

function initializeViewNavigation() {
  const communicatorButton = document.getElementById("showCommunicator");
  const agendaButton = document.getElementById("showAgenda");

  communicatorButton?.addEventListener("click", () => {
    showAppView("communicator");
    updateViewUrl("communicator");
  });

  agendaButton?.addEventListener("click", () => {
    showAppView("agenda");
    updateViewUrl("agenda");
  });

  const requestedView =
    new URLSearchParams(location.search).get("view");

  showAppView(
    requestedView === "agenda" ? "agenda" : "communicator",
    false
  );
}

const DEFAULT_AGENDA_IDS = ["piante", "parco", "merenda", "casa"];

let agenda = [];
let activitySelectionDraft = [];

function getAgendaActivityCatalog() {
  return AGENDA_ACTIVITY_DEFINITIONS
    .map(definition => {
      if (definition.img) {
        return { ...definition };
      }

      const caaItem = DEFAULT_CAA.find(
        item => item.key === definition.caaKey
      );

      if (!caaItem?.img) return null;

      return {
        ...definition,
        img: caaItem.img
      };
    })
    .filter(Boolean);
}

function getAgendaCatalogMap() {
  return new Map(
    getAgendaActivityCatalog().map(item => [item.id, item])
  );
}

function createAgendaFromIds(ids, preserveDone = true) {
  const catalogMap = getAgendaCatalogMap();
  const doneMap = preserveDone
    ? new Map(agenda.map(item => [item.id, Boolean(item.done)]))
    : new Map();

  return ids
    .map((id, index) => {
      const activity = catalogMap.get(id);
      if (!activity) return null;

      return {
        id: activity.id,
        testo: activity.testo,
        img: activity.img,
        ordine: index + 1,
        done: doneMap.get(id) || false
      };
    })
    .filter(Boolean);
}

function sanitizeAgenda(items) {
  const catalogMap = getAgendaCatalogMap();

  if (!Array.isArray(items)) return [];

  const seen = new Set();

  return items
    .slice()
    .sort((a, b) => (a.ordine ?? 999) - (b.ordine ?? 999))
    .map(item => {
      const catalogItem = catalogMap.get(item.id);

      if (!catalogItem || seen.has(item.id)) return null;
      seen.add(item.id);

      return {
        id: catalogItem.id,
        testo: catalogItem.testo,
        img: catalogItem.img,
        ordine: seen.size,
        done: Boolean(item.done)
      };
    })
    .filter(Boolean);
}

function defaultAgenda() {
  return createAgendaFromIds(DEFAULT_AGENDA_IDS, false);
}

async function initializeAgenda() {
  if (storageMode === "indexeddb") {
    const db = await openDB();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_AGENDA, "readwrite");
      const store = tx.objectStore(STORE_AGENDA);
      const req = store.getAll();

      req.onsuccess = () => {
        let normalized = sanitizeAgenda(req.result);

        if (!normalized.length) {
          normalized = defaultAgenda();
        }

        store.clear();
        normalized.forEach(item => store.put(item));
      };

      req.onerror = () => reject(req.error);

      tx.oncomplete = () => {
        db.close();
        resolve();
      };

      tx.onerror = () => {
        const err = tx.error;
        db.close();
        reject(err);
      };
    });

    agenda = await loadAgenda();
    return;
  }

  if (storageMode === "localstorage") {
    try {
      const raw = localStorage.getItem(AGENDA_STORAGE_KEY);
      let normalized = raw
        ? sanitizeAgenda(JSON.parse(raw))
        : [];

      if (!normalized.length) {
        normalized = defaultAgenda();
      }

      agenda = normalized;
      localStorage.setItem(
        AGENDA_STORAGE_KEY,
        JSON.stringify(agenda)
      );
      return;
    } catch {
      agenda = defaultAgenda();
      return;
    }
  }

  memoryAgenda = defaultAgenda();
  agenda = memoryAgenda.map(item => ({ ...item }));
}

async function loadAgenda() {
  if (storageMode === "indexeddb") {
    const db = await openDB();

    const items = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_AGENDA, "readonly");
      const store = tx.objectStore(STORE_AGENDA);
      const req = store.getAll();

      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => db.close();
    });

    const normalized = sanitizeAgenda(items);
    return normalized.length ? normalized : defaultAgenda();
  }

  if (storageMode === "localstorage") {
    try {
      const raw = localStorage.getItem(AGENDA_STORAGE_KEY);
      const normalized = raw
        ? sanitizeAgenda(JSON.parse(raw))
        : [];

      return normalized.length ? normalized : defaultAgenda();
    } catch {
      return defaultAgenda();
    }
  }

  const normalized = sanitizeAgenda(memoryAgenda);
  return normalized.length ? normalized : defaultAgenda();
}

async function saveAgenda() {
  agenda = sanitizeAgenda(agenda);

  if (storageMode === "indexeddb") {
    const db = await openDB();

    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_AGENDA, "readwrite");
      const store = tx.objectStore(STORE_AGENDA);

      store.clear();
      agenda.forEach(item => store.put(item));

      tx.oncomplete = () => {
        db.close();
        resolve();
      };

      tx.onerror = () => {
        const err = tx.error;
        db.close();
        reject(err);
      };
    });

    return;
  }

  if (storageMode === "localstorage") {
    try {
      localStorage.setItem(
        AGENDA_STORAGE_KEY,
        JSON.stringify(agenda)
      );
    } catch {}
    return;
  }

  memoryAgenda = agenda.map(item => ({ ...item }));
}

function createAgendaCard(item) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "agenda-card";
  button.dataset.agendaId = item.id;
  button.setAttribute("aria-pressed", item.done ? "true" : "false");

  const visual = document.createElement("img");
  visual.className = "agenda-card-visual";
  visual.src = item.img;
  visual.alt = "";
  visual.setAttribute("aria-hidden", "true");
  visual.decoding = "async";

  const label = document.createElement("span");
  label.className = "agenda-card-label";
  label.textContent = item.testo;

  button.append(visual, label);

  if (item.done) {
    button.classList.add("agenda-card--done");

    const state = document.createElement("span");
    state.className = "agenda-card-state";
    state.setAttribute("aria-hidden", "true");
    state.textContent = "✓ FINITO";
    button.appendChild(state);
  }

  button.setAttribute(
    "aria-label",
    item.done
      ? `${item.testo}. Attività completata. Tocca per riportarla nelle attività.`
      : `${item.testo}. Tocca per segnare come completata.`
  );

  button.addEventListener("click", () => {
    toggleAgendaItem(item.id);
  });

  return button;
}

function renderAgenda(focusId = null) {
  const todo = document.getElementById("agendaTodo");
  const done = document.getElementById("agendaDone");

  if (!todo || !done) return;

  todo.replaceChildren();
  done.replaceChildren();

  agenda
    .slice()
    .sort((a, b) => a.ordine - b.ordine)
    .forEach(item => {
      const card = createAgendaCard(item);

      if (item.done) {
        done.appendChild(card);
      } else {
        todo.appendChild(card);
      }
    });

  if (!agenda.length) {
    const empty = document.createElement("p");
    empty.className = "agenda-empty";
    empty.textContent =
      "Nessuna attività selezionata. Usa SCEGLI ATTIVITÀ.";
    todo.appendChild(empty);
  }

  if (focusId) {
    requestAnimationFrame(() => {
      document
        .querySelector(`[data-agenda-id="${focusId}"]`)
        ?.focus();
    });
  }
}

async function toggleAgendaItem(id) {
  const item = agenda.find(entry => entry.id === id);
  if (!item) return;

  item.done = !item.done;

  await saveAgenda();
  renderAgenda(id);

  const announcement =
    document.getElementById("agendaAnnouncement");

  if (announcement) {
    announcement.textContent = item.done
      ? `${item.testo}. Attività completata.`
      : `${item.testo}. Riportata nelle attività.`;
  }
}

async function resetAgenda() {
  agenda = agenda.map((item, index) => ({
    ...item,
    ordine: index + 1,
    done: false
  }));

  await saveAgenda();
  renderAgenda();

  const announcement =
    document.getElementById("agendaAnnouncement");

  if (announcement) {
    announcement.textContent =
      "Agenda ripristinata. Tutte le attività sono di nuovo da svolgere.";
  }
}

function renderActivityPicker() {
  const grid = document.getElementById("activityPickerGrid");
  const confirmButton =
    document.getElementById("confirmActivitySelection");

  if (!grid) return;

  grid.replaceChildren();

  const catalog = getAgendaActivityCatalog();

  catalog.forEach(activity => {
    const selectedIndex =
      activitySelectionDraft.indexOf(activity.id);

    const button = document.createElement("button");
    button.type = "button";
    button.className = "activity-picker-card";
    button.dataset.activityId = activity.id;
    button.setAttribute(
      "aria-pressed",
      selectedIndex >= 0 ? "true" : "false"
    );

    const image = document.createElement("img");
    image.src = activity.img;
    image.alt = "";
    image.setAttribute("aria-hidden", "true");

    const label = document.createElement("span");
    label.textContent = activity.testo;

    button.append(image, label);

    if (selectedIndex >= 0) {
      const order = document.createElement("span");
      order.className = "activity-picker-order";
      order.setAttribute("aria-hidden", "true");
      order.textContent = String(selectedIndex + 1);
      button.appendChild(order);

      button.setAttribute(
        "aria-label",
        `${activity.testo}. Selezionata come attività numero ${selectedIndex + 1}. Tocca per rimuovere.`
      );
    } else {
      button.setAttribute(
        "aria-label",
        `${activity.testo}. Tocca per aggiungere all’agenda.`
      );
    }

    button.addEventListener("click", () => {
      const index =
        activitySelectionDraft.indexOf(activity.id);

      if (index >= 0) {
        activitySelectionDraft.splice(index, 1);
      } else {
        activitySelectionDraft.push(activity.id);
      }

      renderActivityPicker();

      requestAnimationFrame(() => {
        document
          .querySelector(
            `[data-activity-id="${activity.id}"]`
          )
          ?.focus();
      });
    });

    grid.appendChild(button);
  });

  if (confirmButton) {
    confirmButton.disabled =
      activitySelectionDraft.length === 0;
  }
}

function openActivityPicker() {
  const picker = document.getElementById("activityPicker");
  const workspace = document.getElementById("agendaWorkspace");
  const chooseButton = document.getElementById("chooseActivities");

  activitySelectionDraft = agenda
    .slice()
    .sort((a, b) => a.ordine - b.ordine)
    .map(item => item.id);

  picker.hidden = false;
  workspace.hidden = true;
  chooseButton.setAttribute("aria-expanded", "true");

  renderActivityPicker();

  requestAnimationFrame(() => {
    document
      .getElementById("activityPickerTitle")
      ?.setAttribute("tabindex", "-1");

    document
      .getElementById("activityPickerTitle")
      ?.focus();
  });
}

function closeActivityPicker(returnFocus = true) {
  const picker = document.getElementById("activityPicker");
  const workspace = document.getElementById("agendaWorkspace");
  const chooseButton = document.getElementById("chooseActivities");

  picker.hidden = true;
  workspace.hidden = false;
  chooseButton.setAttribute("aria-expanded", "false");

  if (returnFocus) {
    requestAnimationFrame(() => chooseButton.focus());
  }
}

async function confirmActivitySelection() {
  if (!activitySelectionDraft.length) return;

  agenda = createAgendaFromIds(
    activitySelectionDraft,
    true
  );

  await saveAgenda();
  renderAgenda();
  closeActivityPicker(false);

  const announcement =
    document.getElementById("agendaAnnouncement");

  if (announcement) {
    announcement.textContent =
      `Agenda aggiornata con ${agenda.length} attività.`;
  }

  requestAnimationFrame(() => {
    document.getElementById("chooseActivities")?.focus();
  });
}

async function startAgenda() {
  try {
    await initializeAgenda();
  } catch (err) {
    console.warn(
      "Agenda: memoria persistente non disponibile.",
      err
    );

    memoryAgenda = defaultAgenda();
    agenda = memoryAgenda.map(item => ({ ...item }));
  }

  renderAgenda();

  document
    .getElementById("resetAgenda")
    ?.addEventListener("click", resetAgenda);

  document
    .getElementById("chooseActivities")
    ?.addEventListener("click", openActivityPicker);

  document
    .getElementById("cancelActivitySelection")
    ?.addEventListener("click", () => {
      closeActivityPicker();
    });

  document
    .getElementById("confirmActivitySelection")
    ?.addEventListener("click", confirmActivitySelection);
}



async function requestPersistentStorage() {
  if (!navigator.storage?.persist) return false;
  try {
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch {
    return false;
  }
}

let deferredInstallPrompt = null;

function announcePWA(message) {
  const node = document.getElementById("pwaAnnouncement");
  if (node) node.textContent = message;
}

function initializePWAInstall() {
  const installButton = document.getElementById("installApp");
  if (!installButton) return;

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.hidden = false;
  });

  installButton.addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;

    installButton.disabled = true;

    try {
      await deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;

      if (choice?.outcome === "accepted") {
        announcePWA("Installazione di ABA PRATICO avviata.");
      }
    } catch (err) {
      console.warn("Installazione PWA non disponibile.", err);
    } finally {
      deferredInstallPrompt = null;
      installButton.hidden = true;
      installButton.disabled = false;
    }
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    installButton.hidden = true;
    announcePWA("ABA PRATICO è stata installata.");
  });
}

async function registerPWAServiceWorker() {
  if (!("serviceWorker" in navigator)) return;

  try {
    const registration =
      await navigator.serviceWorker.register("./service-worker.js");

    registration.update().catch(() => {});
  } catch (err) {
    console.warn("Service worker non registrato.", err);
  }
}

function initializePWA() {
  initializePWAInstall();
  registerPWAServiceWorker();
}

async function startApp() {
  clearError();
  loadItalianVoice();

  try {
    await requestPersistentStorage();
    await initializeCAA();
    await renderCAA();
    await startAgenda();
    initializeViewNavigation();
  } catch (err) {
    console.error(err);
    showError("Si è verificato un problema durante l’avvio. Il comunicatore viene caricato in modalità di sicurezza.");

    caaGrid.replaceChildren();
    DEFAULT_CAA.forEach(item => caaGrid.appendChild(createCAACard(item)));

    memoryAgenda = defaultAgenda();
    agenda = memoryAgenda.map(item => ({ ...item }));
    renderAgenda();

    document
      .getElementById("resetAgenda")
      ?.addEventListener("click", resetAgenda);

    document
      .getElementById("chooseActivities")
      ?.addEventListener("click", openActivityPicker);

    document
      .getElementById("cancelActivitySelection")
      ?.addEventListener("click", () => closeActivityPicker());

    document
      .getElementById("confirmActivitySelection")
      ?.addEventListener("click", confirmActivitySelection);

    initializeViewNavigation();
  }
}


if ("speechSynthesis" in window) {
  window.speechSynthesis.addEventListener("voiceschanged", loadItalianVoice);
}

initializePWA();
startApp();

/* Esposto volutamente solo per test/sviluppo locale.
   Esempio console:
   ABA_PRATICO_TEST.renameSete("VOGLIO BERE")
*/
window.ABA_PRATICO_TEST = {
  async renameSete(nuovoTesto = "VOGLIO BERE") {
    const items = await loadCAA();
    const item = items.find(x => x.key === "sete");
    if (!item) throw new Error("Tessera sete non trovata");
    item.testo = nuovoTesto;
    await saveCAACard(item);
    await renderCAA();
    return true;
  },

  async resetCAA() {
    if (storageMode === "indexeddb") {
      const db = await openDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_CAA, "readwrite");
        const store = tx.objectStore(STORE_CAA);
        store.clear();
        DEFAULT_CAA.forEach(item => store.put(item));
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    } else if (storageMode === "localstorage") {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(cloneDefaults()));
    } else {
      memoryCAA = cloneDefaults();
    }

    await renderCAA();
    return true;
  }
};
</script>
